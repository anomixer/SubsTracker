name = "subscription-manager"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "subscription-manager"

[env.staging]
name = "subscription-manager-staging"

# KV 命名空間配置（預設模板不預設固定 ID，執行 npm run setup 自動生成）

# 定時任務配置 - 每小時檢查一次（UTC）
[triggers]
crons = ["0 * * * *"]

# 環境變數（可選，也可以在 Cloudflare Dashboard 中設定）
[vars]
ENVIRONMENT = "production"
